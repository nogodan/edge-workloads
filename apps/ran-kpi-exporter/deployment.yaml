# Purpose: ran-kpi-exporter workload. Restored after an unrelated AI proposal
#          (INC0010051, fabricated content) was mistakenly approved and merged,
#          overwriting this file with an "orders-api" manifest. This is the
#          real, working ran-kpi-exporter Deployment: NMS_ENDPOINT set, image
#          tag corrected back from the deliberately-injected "alpine:3.2o" typo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ran-kpi-exporter
  namespace: ran-edge
  labels:
    app: ran-kpi-exporter
    app.kubernetes.io/part-of: aiops-edge-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ran-kpi-exporter
  template:
    metadata:
      labels:
        app: ran-kpi-exporter
        site: edge
    spec:
      containers:
        - name: ran-kpi-exporter
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -z "$NMS_ENDPOINT" ]; then
                echo "FATAL: NMS_ENDPOINT is not set; refusing to start" >&2
                exit 1
              fi
              echo "ran-kpi-exporter healthy; NMS at $NMS_ENDPOINT"
              exec sleep infinity
          env:
            - name: NMS_ENDPOINT
              value: "http://nms.ran-edge.svc.cluster.local:8080"
