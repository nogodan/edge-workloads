# Purpose: ran-kpi-exporter workload. DELIBERATELY BROKEN for demo testing:
#          image tag typo'd to alpine:3.2o (letter O instead of zero) so the
#          container can never be pulled -> ImagePullBackOff. This matches the
#          fault already present on the live cluster (kubectl set image), so
#          this commit makes git and the live drifted state consistent again -
#          the AI remediation flow should find and fix this via find/replace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ran-kpi-exporter
  namespace: ran-edge
  labels:
    app: ran-kpi-exporter
    app.kubernetes.io/part-of: aiops-edge-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ran-kpi-exporter
  template:
    metadata:
      labels:
        app: ran-kpi-exporter
        site: edge
    spec:
      containers:
        - name: ran-kpi-exporter
          image: alpine:3.2o
          command: ["/bin/sh", "-c"]
          args:
            - |
              if [ -z "$NMS_ENDPOINT" ]; then
                echo "FATAL: NMS_ENDPOINT is not set; refusing to start" >&2
                exit 1
              fi
              echo "ran-kpi-exporter healthy; NMS at $NMS_ENDPOINT"
              exec sleep infinity
          env:
            - name: NMS_ENDPOINT
              value: "http://nms.ran-edge.svc.cluster.local:8080"
